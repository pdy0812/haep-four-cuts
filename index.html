<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해프 네컷</title>
<style>
:root{--pink:#ff8fb1;--cream:#fffaf6;--ink:#4a3b42;--panel:#fff;--line:#f2dce4}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(135deg,#fff5f8,#fffdf2);color:var(--ink)}
header{padding:22px 20px 8px;text-align:center} h1{margin:0;font-size:30px;letter-spacing:-1px}.sub{margin:6px 0 0;color:#8c747d}
.wrap{max-width:980px;margin:auto;padding:14px;display:grid;grid-template-columns:1fr 330px;gap:18px}
.card{background:#ffffffcc;border:1px solid #fff;border-radius:28px;padding:18px;box-shadow:0 16px 45px #dba7b52c;backdrop-filter:blur(8px)}
.camera{aspect-ratio:4/3;background:#f5e9ed;border-radius:22px;overflow:hidden;display:grid;place-items:center;position:relative}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)} .empty{padding:30px;text-align:center;color:#8f7881}
.actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:18px;padding:14px 16px;font-weight:800;font-size:16px;cursor:pointer}.primary{background:var(--pink);color:white;flex:1}.secondary{background:#fff0f5;color:#a95673}
.stripWrap{display:flex;justify-content:center}.strip{width:220px;padding:12px 12px 18px;background:#ffd8e5;border-radius:12px;box-shadow:0 12px 28px #7b4b5a22;position:relative;overflow:hidden}
.strip.hearts:before{content:"♡  ♡  ♡";position:absolute;top:2px;left:8px;color:#fff8;font-size:24px;transform:rotate(-8deg)}
.strip.check{background-color:#ffe8a8;background-image:linear-gradient(90deg,#fff8 1px,transparent 1px),linear-gradient(#fff8 1px,transparent 1px);background-size:18px 18px}
.strip.blue{background:#bfe4ff}.strip.lav{background:#d9c8ff}.strip.white{background:#fff;border:1px solid #eee}.strip.black{background:#202124;color:white}
.shot{height:126px;background:#fff9;border-radius:6px;margin-bottom:8px;overflow:hidden;display:grid;place-items:center;color:#b998a4;font-size:13px}.shot img{width:100%;height:100%;object-fit:cover}
.brand{text-align:center;font-size:19px;font-weight:900;margin-top:11px;letter-spacing:1px}.date{text-align:center;font-size:12px;margin-top:4px;opacity:.75}
.label{font-weight:800;margin:16px 0 9px}.frames{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.sw{aspect-ratio:1;border:3px solid white;box-shadow:0 0 0 1px #eadde2;border-radius:12px;cursor:pointer}.sw.on{outline:3px solid #ff8fb1}.tiny{font-size:12px;color:#9a838c;margin-top:14px;line-height:1.5}
.save{width:100%;margin-top:15px;background:#4a3b42;color:white}
canvas{display:none}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.card.preview{order:-1}.strip{width:205px}.shot{height:116px}}
</style>
</head>
<body>
<header><h1>🎀 해프 네컷</h1><p class="sub">오늘의 귀여운 순간을 네 장에 담아요 ✦</p></header>
<main class="wrap">
<section class="card">
  <div class="camera" id="camera"><div class="empty" id="empty">📷<br><b>카메라를 켜고 네 컷을 찍어보세요</b><br><small>아이패드 전면 카메라를 사용해요</small></div><video id="video" autoplay playsinline muted></video></div>
  <div class="actions"><button class="btn secondary" id="camBtn">카메라 켜기</button><button class="btn primary" id="snapBtn">찰칵! 사진 찍기 ♡</button><button class="btn secondary" id="redoBtn">↺</button></div>
  <div class="label">프레임 고르기</div>
  <div class="frames">
   <button class="sw on" data-f="hearts" style="background:#ffd8e5" title="딸기우유"></button>
   <button class="sw" data-f="blue" style="background:#bfe4ff" title="소다"></button>
   <button class="sw" data-f="lav" style="background:#d9c8ff" title="라벤더"></button>
   <button class="sw" data-f="check" style="background:#ffe8a8" title="체크"></button>
   <button class="sw" data-f="white" style="background:white" title="화이트"></button>
   <button class="sw" data-f="black" style="background:#202124" title="블랙"></button>
  </div>
  <p class="tiny">촬영한 사진은 서버로 전송하지 않고 이 기기 안에서만 합성하도록 만든 시안입니다.</p>
</section>

<section class="card preview">
 <div class="stripWrap"><div class="strip hearts" id="strip">
   <div class="shot">1번째 사진</div><div class="shot">2번째 사진</div><div class="shot">3번째 사진</div><div class="shot">4번째 사진</div>
   <div class="brand">해프 네컷 ♡</div><div class="date">2026. 09. 18</div>
 </div></div>
 <button class="btn save" id="saveBtn">JPEG로 저장하기 ↓</button>
</section>
</main>
<canvas id="canvas" width="900" height="2700"></canvas>
<script>
const video=document.querySelector('#video'), empty=document.querySelector('#empty'), strip=document.querySelector('#strip');
let stream=null, photos=[];
async function camera(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});video.srcObject=stream;empty.style.display='none'}
 catch(e){alert('카메라 권한을 허용해 주세요. Safari 설정에서도 카메라 접근을 확인해 주세요.')}
}
document.querySelector('#camBtn').onclick=camera;
document.querySelector('#snapBtn').onclick=()=>{
 if(!stream){camera();return}
 if(photos.length>=4) photos.shift();
 const c=document.createElement('canvas');c.width=900;c.height=600;const x=c.getContext('2d');
 x.translate(c.width,0);x.scale(-1,1);x.drawImage(video,0,0,c.width,c.height);
 photos.push(c.toDataURL('image/jpeg',.95)); render();
};
document.querySelector('#redoBtn').onclick=()=>{photos.pop();render()};
function render(){
 [...strip.querySelectorAll('.shot')].forEach((el,i)=>{el.innerHTML=photos[i]?`<img src="${photos[i]}">`:`${i+1}번째 사진`});
}
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 strip.className='strip '+b.dataset.f;
});
document.querySelector('#saveBtn').onclick=async()=>{
 if(photos.length<4){alert('먼저 사진 4장을 찍어주세요 ♡');return}
 const c=document.querySelector('#canvas'),x=c.getContext('2d'); const f=document.querySelector('.sw.on').dataset.f;
 const colors={hearts:'#ffd8e5',blue:'#bfe4ff',lav:'#d9c8ff',check:'#ffe8a8',white:'#ffffff',black:'#202124'};
 x.fillStyle=colors[f];x.fillRect(0,0,c.width,c.height);
 for(let i=0;i<4;i++){let im=new Image();await new Promise(r=>{im.onload=r;im.src=photos[i]});x.drawImage(im,55,55+i*590,790,525)}
 x.textAlign='center';x.fillStyle=f==='black'?'white':'#4a3b42';x.font='bold 74px sans-serif';x.fillText('해프 네컷 ♡',450,2490);x.font='38px sans-serif';x.fillText('2026. 09. 18',450,2560);
 c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='해프네컷_2026-09-18.jpg';a.click()},'image/jpeg',.96)
};
</script>
</body></html>
