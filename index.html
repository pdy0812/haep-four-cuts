<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해프 네컷</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=Poor+Story&display=swap');
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7fa,#fffdf6);color:#493d43;font-family:'Gowun Dodum',sans-serif}
header{text-align:center;padding:26px 12px 10px}h1{font-family:Jua;margin:0;color:#e86f9b;font-size:36px}.sub{color:#9d818b;margin-top:5px}
.app{max-width:1100px;margin:auto;padding:14px;display:grid;grid-template-columns:1fr 360px;gap:20px}.card{background:#fffc;border:1px solid #f3dce5;border-radius:28px;padding:18px;box-shadow:0 14px 40px #9e6a7b1b}
.camera{aspect-ratio:4/3;background:#f5e9ee;border-radius:22px;overflow:hidden;position:relative;display:grid;place-items:center}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.hint{position:absolute;text-align:center;color:#967b85}
.row,.choices{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.btn,.chip{border:0;border-radius:15px;padding:11px 14px;font:700 15px inherit;background:#ffe8f0;color:#8e4f65}.primary{background:#f584aa;color:white;flex:1}.label{font-weight:700;margin:18px 0 8px}
.input{width:100%;padding:12px;border:1px solid #ead8df;border-radius:14px;font-size:16px;background:white}.sw{width:42px;height:42px;border:3px solid white;border-radius:12px;box-shadow:0 0 0 1px #e9d7de}.on{outline:3px solid #f584aa}
.strip{width:240px;padding:13px 13px 20px;border-radius:12px;background:#ffd5e3;position:relative;overflow:hidden;box-shadow:0 12px 30px #79515f24}.shot{height:132px;background:#fff9;border-radius:6px;margin-bottom:9px;overflow:hidden;display:grid;place-items:center;color:#ad8e99}.shot img{width:100%;height:100%;object-fit:cover}.caption{text-align:center;font:700 22px Jua;margin-top:10px}.date{text-align:center;font-size:12px;margin-top:4px}.decor{position:absolute;inset:0;pointer-events:none}.sticker{position:absolute;font-size:29px;filter:drop-shadow(0 2px 2px #fff)}
.save{width:100%;margin-top:14px;background:#493d43;color:white}.note{font-size:12px;color:#a18790}.pattern{position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#fff 2px,transparent 2px);background-size:18px 18px}
@media(max-width:780px){.app{grid-template-columns:1fr}.previewCard{order:-1}.strip{width:220px}.shot{height:122px}}
</style></head>
<body><header><h1>🎀 해프 네컷</h1><div class="sub">오늘의 귀여운 순간을 네 장에 담아요 ✦</div></header>
<main class="app">
<section class="card">
<div class="camera"><div id="hint" class="hint">📷<br><b>카메라를 켜고 네 컷을 찍어보세요</b><br>아이패드 전면 카메라를 사용해요</div><video id="v" autoplay playsinline muted></video></div>
<div class="row"><button class="btn" id="cam">카메라 켜기</button><button class="btn primary" id="snap">찰칵! 사진 찍기 ♡</button><button class="btn" id="undo">↺</button></div>
<div class="label">프레임 고르기</div><div class="choices">
<button class="sw on" data-c="#ffd5e3" style="background:#ffd5e3"></button><button class="sw" data-c="#bfe2ff" style="background:#bfe2ff"></button><button class="sw" data-c="#d9c9ff" style="background:#d9c9ff"></button><button class="sw" data-c="#ffe5a3" style="background:#ffe5a3"></button><button class="sw" data-c="#fff" style="background:#fff"></button><button class="sw" data-c="#222" style="background:#222"></button>
</div>
<div class="label">프레임 느낌</div><div class="choices"><button class="chip pat on" data-p="plain">심플</button><button class="chip pat" data-p="dot">도트 ✦</button><button class="chip pat" data-p="heart">하트 ♡</button></div>
<div class="label">내 문구</div><input id="txt" class="input" maxlength="28" value="해프 네컷 ♡">
<div class="label">귀여운 글씨체</div><div class="choices"><button class="chip font on" data-f="Jua">몽글</button><button class="chip font" data-f="Gaegu">손글씨</button><button class="chip font" data-f="Nanum Pen Script">펜글씨</button><button class="chip font" data-f="Poor Story">낙서</button><button class="chip font" data-f="Gowun Dodum">깔끔</button></div>
<div class="label">날짜</div><input id="date" class="input" type="date" value="2026-09-18">
<div class="label">감성 스티커</div><div class="choices" id="stickers"><button class="chip">♡</button><button class="chip">✦</button><button class="chip">🎀</button><button class="chip">☁️</button><button class="chip">🌷</button><button class="chip">🍒</button><button class="chip">🫧</button><button class="chip">🐰</button><button class="chip">🧸</button><button class="chip">✨</button></div>
<div class="row"><button class="btn" id="clear">스티커 모두 지우기</button></div><p class="note">사진은 서버에 전송하지 않고 이 기기에서만 합성돼요.</p>
</section>
<section class="card previewCard"><div style="display:flex;justify-content:center"><div class="strip" id="strip"><div id="pattern"></div><div class="shot">1번째 사진</div><div class="shot">2번째 사진</div><div class="shot">3번째 사진</div><div class="shot">4번째 사진</div><div class="caption" id="caption">해프 네컷 ♡</div><div class="date" id="dateOut">2026. 09. 18</div><div class="decor" id="decor"></div></div></div><button class="btn save" id="save">JPEG로 저장하기 ↓</button></section>
</main><canvas id="out" width="900" height="2700" hidden></canvas>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),v=$('#v'),strip=$('#strip'),caption=$('#caption'),dateOut=$('#dateOut'),decor=$('#decor');
let stream,photos=[],frame='#ffd5e3',font='Jua',decos=[],pattern='plain';
async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1600},height:{ideal:1200}},audio:false});v.srcObject=stream;$('#hint').style.display='none'}catch(e){alert('카메라 접근을 허용해주세요. Safari 주소창의 웹사이트 설정에서도 카메라를 허용할 수 있어요.')}}
$('#cam').onclick=camera;$('#snap').onclick=()=>{if(!stream){camera();return}if(photos.length>=4)photos.shift();let c=document.createElement('canvas');c.width=900;c.height=600;let x=c.getContext('2d');x.translate(900,0);x.scale(-1,1);x.drawImage(v,0,0,900,600);photos.push(c.toDataURL('image/jpeg',.95));render()};
$('#undo').onclick=()=>{photos.pop();render()};function render(){$$('.shot').forEach((e,i)=>e.innerHTML=photos[i]?`<img src="${photos[i]}">`:`${i+1}번째 사진`)}
$$('.sw').forEach(b=>b.onclick=()=>{$$('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');frame=b.dataset.c;strip.style.background=frame;strip.style.color=frame==='#222'?'#fff':'#493d43'});
$('#txt').oninput=e=>caption.textContent=e.target.value||' ';
$$('.font').forEach(b=>b.onclick=()=>{$$('.font').forEach(x=>x.classList.remove('on'));b.classList.add('on');font=b.dataset.f;caption.style.fontFamily=font});
function fd(s){let a=s.split('-');return a.length===3?`${a[0]}. ${a[1]}. ${a[2]}`:''}$('#date').oninput=e=>dateOut.textContent=fd(e.target.value);
$$('.pat').forEach(b=>b.onclick=()=>{$$('.pat').forEach(x=>x.classList.remove('on'));b.classList.add('on');pattern=b.dataset.p;let p=$('#pattern');p.className=pattern==='dot'?'pattern':'';p.innerHTML=pattern==='heart'?'<div style="position:absolute;inset:4px;font-size:22px;letter-spacing:9px;color:#fff">♡ ♡<br><br><br>♡<br><br><br>♡ ♡</div>':''});
$$('#stickers .chip').forEach(b=>b.onclick=()=>{decos.push({t:b.textContent,x:6+Math.random()*78,y:3+Math.random()*82,r:-18+Math.random()*36});draw()});function draw(){decor.innerHTML='';decos.forEach(o=>{let s=document.createElement('span');s.className='sticker';s.textContent=o.t;s.style.cssText=`left:${o.x}%;top:${o.y}%;transform:rotate(${o.r}deg)`;decor.appendChild(s)})}$('#clear').onclick=()=>{decos=[];draw()};
$('#save').onclick=async()=>{if(photos.length<4){alert('사진 4장을 먼저 찍어주세요 ♡');return}let c=$('#out'),x=c.getContext('2d');x.fillStyle=frame;x.fillRect(0,0,900,2700);for(let i=0;i<4;i++){let im=new Image();await new Promise(r=>{im.onload=r;im.src=photos[i]});x.drawImage(im,50,50+i*590,800,530)}x.fillStyle=frame==='#222'?'white':'#493d43';x.textAlign='center';x.font=`bold 74px "${font}",sans-serif`;x.fillText(caption.textContent,450,2490);x.font='36px sans-serif';x.fillText(dateOut.textContent,450,2560);x.textAlign='left';x.font='88px sans-serif';decos.forEach(o=>x.fillText(o.t,o.x*9,o.y*24));c.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='haep-four-cuts.jpg';a.click()},'image/jpeg',.96)}
</script></body></html>
